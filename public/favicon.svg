<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#1A1A1A"/>
  <!-- Stacked "fact cards" forming the spine of an F -->
  <g fill="#FAFAFA">
    <!-- top bar of the F -->
    <rect x="138" y="132" width="236" height="64" rx="18"/>
    <!-- middle bar of the F -->
    <rect x="138" y="232" width="168" height="64" rx="18"/>
    <!-- vertical stem of the F -->
    <rect x="138" y="132" width="64" height="248" rx="18"/>
  </g>
  <!-- accent dot: the "fact" being forged -->
  <circle cx="350" cy="350" r="34" fill="#6366F1"/>
</svg>
